[project]
name = "whois"
version = "2.2.13"
description = "This app implements investigative actions that query the whois database"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13, <3.14"
authors = []
dependencies = [
    "charset-normalizer==3.4.2",
    "dnspython==2.7.0",
    "ipwhois==1.3.0",
    "pythonwhois-alt @ https://raw.githubusercontent.com/splunk-soar-connectors/whois/87565e27d1da6b8303560d2f4337690e6fb9f46d/wheels/py3/pythonwhois_alt-2.4.6-py3-none-any.whl",
    "requests-file==1.5.1",
    "splunk-soar-sdk>=4.2.0",
    "tldextract==5.3.2",
]

[tool.soar.app]
main_module = "src.app:app"

[dependency-groups]
dev = [
    "coverage>=7.6.7,<8",
    "mypy>=1.2.0,<2",
    "pre-commit>=4.2.0,<5",
    "pytest>=7.4.2,<9",
    "pytest-cov>=5.0.0,<6",
    "pytest-mock>=3.14.0,<4",
    "pytest-watch>=4.2.0,<5",
    "pytest-xdist>=3.6.1,<4",
    "ruff>=0.11.6,<1",
]

[[tool.uv.index]]
url = "https://pypi.python.org/simple"

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.13'",
    "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.13'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version == '3.13'",
    "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.13'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.13'",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
output-format = "full"
target-version = "py313"

[tool.ruff.lint]
select = [
    "ERA",
    "YTT",
    "S",
    "B",
    "A",
    "DTZ",
    "T10",
    "ISC",
    "PT",
    "SIM",
    "PTH",
    "E",
    "F",
    "W",
    "PL",
    "UP",
    "RUF",
]
ignore = [
    "E501",
    "PT006",
    "PT007",
    "PTH123",
    "PLR",
]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ANN", "S"]
"src/**/*" = ["PT"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.format]
docstring-code-format = true

[tool.djlint]
profile = "django"
extension = "html"
indent = 2
include = "H008,H009,H010,H014,H024,H026,H033,T028,T034"
ignore = "D004,D018,H005,H006,H007,H011,H012,H013,H015,H016,H017,H019,H020,H021,H022,H023,H025,H029,H030,H031,H035,H036,H037,J004,J018,T001,T002,T003,T027,T032"

[tool.mdformat]
wrap = true
number = true

[tool.semgrep]
config = [
    "p/python",
    "semgrep",
    "r/typescript.react.security.audit.react-dangerouslysetinnerhtml.react-dangerouslysetinnerhtml",
]
ignore-patterns = [
    "dist/",
    "vendor/",
    "env/",
    ".env/",
    "venv/",
    ".venv/",
    "test/",
    "tests/",
    ".semgrep",
    "wheels/",
    ".html",
    ".md",
    ".svg",
]
